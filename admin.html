<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日程管理</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="site-header"><a class="brand" href="./">日程調整</a><a href="index.html">参加者画面</a></header><main class="shell"><section class="hero"><p class="eyebrow">ADMIN</p><h1>日程を管理</h1><p>候補日を編集し、共有リンクを参加者へ送れます。</p></section><section id="notice" class="notice" hidden></section><section class="card admin-grid"><label>予定を切り替える<select id="scheduleSelect" aria-describedby="scheduleHint"><option value="">読み込み中…</option></select><small id="scheduleHint">過去に作成した予定を更新日時順に表示します。</small></label><label>管理パスワード<input id="password" type="password" autocomplete="current-password"></label><button id="refreshButton" type="button">一覧を更新</button></section><input id="slug" type="hidden"><section id="editor" class="card" hidden><label>タイトル<input id="title" maxlength="100"></label><label>候補日（1行に1日、YYYY-MM-DD）<textarea id="dates" rows="7"></textarea></label>
<fieldset class="time-picker"><legend>回答できる時間帯</legend><p class="time-help">開始時刻と終了時刻を順番に選択してください。1時間単位で設定できます。</p><output id="timeRange" class="time-range" aria-live="polite"></output><div id="hourGrid" class="hour-grid" role="group" aria-label="時間帯を選択"></div></fieldset><input id="startHour" type="hidden"><input id="endHour" type="hidden">
<div class="actions"><button id="saveButton" class="primary">設定を保存</button><button id="copyButton">参加者リンクをコピー</button></div><h2>回答状況</h2><div id="responseSummary" class="summary"></div></section></main><script type="module" src="admin.js"></script></body></html>
